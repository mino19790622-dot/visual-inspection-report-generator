name: eval

# Costing evaluation workflows, triggered manually (workflow_dispatch) so we
# control cost. Three modes:
#   eval      — golden-set quality gate (VLM narrative + LLM judge, threshold-gated)
#   ablation  — 3-arm tool-calling ablation (off / fixed / agentic), eval/ablation_topk.py
#   retrieval — recall@k / MRR against the annotated retrieval truth, plus an
#               optional grounding pass that localises each miss
#               (retrieval_miss vs retrieved_unused). eval/retrieval_eval.py
#               needs only the embedding model, so the ONNX/AWS steps are
#               skipped in this mode.
# Requires the DASHSCOPE_API_KEY repository secret.
#
# NOTE: this workflow is dispatchable pre-merge because it already exists on the
# default branch. A brand-new workflow file (e.g. a standalone ablation.yml) is
# NOT workflow_dispatch-able until it lands on the default branch, so the
# ablation runner lives here instead of in its own file.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "eval = golden-set quality gate; ablation = 3-arm tool-calling comparison; retrieval = recall@k/MRR vs annotated truth"
        type: choice
        options: ["eval", "ablation", "retrieval"]
        default: "eval"
        required: true
      threshold:
        description: "Overall score threshold (0-5 scale, default 3.7). PROVISIONAL — a starting gate, not a calibrated threshold; judge credibility (incl. self-enhancement bias, judge + model both Qwen-family) is validated in phase B."
        required: false
        default: "3.7"
      only:
        description: "Optional: only run this golden-set id (e.g. bus_street_side)"
        required: false
        default: ""
      arms:
        description: "(ablation mode) arms to run, space-separated: off fixed agentic"
        required: false
        default: "off fixed agentic"
      judge:
        description: "(ablation mode) also LLM-judge the narrative (extra cost): true/false"
        required: false
        default: "false"
      grounding:
        description: "(retrieval mode) also run layer G to localise misses. none = retrieval metrics only; fixed/agentic = run the grounding agent too (extra LLM cost)"
        type: choice
        options: ["none", "fixed", "agentic"]
        default: "none"
        required: false

permissions:
  id-token: write      # required for OIDC -> AWS (S3 model download)
  contents: read

env:
  AWS_REGION: eu-west-1
  MODEL_S3_URI: s3://visual-inspection-models-190944420576/yolov8m.onnx

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ github.event.inputs.mode != 'retrieval' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch ONNX model from S3 (gitignored, not in repo)
        if: ${{ github.event.inputs.mode != 'retrieval' }}
        run: aws s3 cp "$MODEL_S3_URI" yolov8m.onnx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime + eval deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt requests

      - name: Cache RAG index
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-eval-${{ github.run_id }}
          restore-keys: chroma-eval-

      - name: Run golden-set evaluation
        # `mode == 'eval'` (and the empty default when dispatched without input).
        # Previously this was `mode != 'ablation'`, which also matched the new
        # 'retrieval' mode and would have run the golden-set eval there too --
        # failing, since retrieval mode deliberately skips the ONNX download.
        if: ${{ github.event.inputs.mode == 'eval' || github.event.inputs.mode == '' }}
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          mkdir -p reports/eval
          ARGS="--threshold ${{ github.event.inputs.threshold || '3.7' }} --out reports/eval/ci-run.json"
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="$ARGS --id ${{ github.event.inputs.only }}"
          fi
          python -m eval.run_eval $ARGS

      - name: Run 3-arm ablation
        if: ${{ github.event.inputs.mode == 'ablation' }}
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          mkdir -p reports/ablation
          ARGS="--arms ${{ github.event.inputs.arms }}"
          if [ "${{ github.event.inputs.judge }}" = "true" ]; then
            ARGS="$ARGS --judge"
          fi
          python -m eval.ablation_topk $ARGS --out reports/ablation/ci-run.json

      - name: Run retrieval evaluation (recall@k / MRR)
        if: ${{ github.event.inputs.mode == 'retrieval' }}
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          mkdir -p reports/retrieval
          python -m eval.retrieval_eval \
            --grounding-mode "${{ github.event.inputs.grounding || 'none' }}" \
            --out reports/retrieval/ci-run.json

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            reports/eval/ci-run.json
            reports/ablation/ci-run.json
            reports/retrieval/ci-run.json
          if-no-files-found: ignore
