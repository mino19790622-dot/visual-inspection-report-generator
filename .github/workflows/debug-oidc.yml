name: debug-oidc

# Temporary diagnostic workflow: checks whether the AWS_ROLE_ARN secret
# matches the expected role ARN, and tests OIDC assume with the known-good
# ARN. Safe to delete after the issue is resolved.

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret value (masked, length only)
        env:
          EXPECTED: arn:aws:iam::190944420576:role/github-actions-deploy
          ACTUAL: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "secret length: ${#ACTUAL} (expected 52)"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "SECRET MATCHES expected ARN"
          else
            echo "SECRET DOES NOT MATCH expected ARN"
            echo "actual prefix: ${ACTUAL%%:*}..."
          fi

      - name: Decode OIDC token claims (sub/aud/iss only)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' )
          case $((${#PAYLOAD} % 4)) in 2) PAYLOAD="${PAYLOAD}==";; 3) PAYLOAD="${PAYLOAD}=";; esac
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss}'

      - name: Test OIDC assume with known-good ARN
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190944420576:role/github-actions-deploy
          aws-region: eu-west-1

      - name: Who am I
        run: aws sts get-caller-identity
