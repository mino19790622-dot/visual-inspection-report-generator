# AWS App Runner service definition
# -------------------------------------------------------------
# Schema matches the App Runner CreateService API (validated via CLI error feedback):
#   - AccessRoleArn is a TOP-LEVEL parameter
#   - Port is a string
#   - RuntimeEnvironmentSecrets / RuntimeEnvironmentVariables are maps
#
# One-time create:
#   aws apprunner create-service --cli-input-yaml file://deploy/apprunner.yaml
#
# After each new image push, roll out:
#   aws apprunner start-deployment --service-arn <SERVICE_ARN> --region eu-west-1
# -------------------------------------------------------------

ServiceName: visual-inspection-api

SourceConfiguration:
  # ECR access role lives here (AuthenticationConfiguration), not top-level
  AuthenticationConfiguration:
    AccessRoleArn: "arn:aws:iam::190944420576:role/apprunner-ecr-access"
  ImageRepository:
    ImageIdentifier: "190944420576.dkr.ecr.eu-west-1.amazonaws.com/visual-inspection-api:latest"
    ImageRepositoryType: ECR
    ImageConfiguration:
      Port: "8000"
      # Secrets pulled from AWS Secrets Manager at runtime (map: name -> ARN)
      RuntimeEnvironmentSecrets:
        DASHSCOPE_API_KEY: "arn:aws:secretsmanager:eu-west-1:190944420576:secret:inspection/dashscope-Prntzf"
      # Non-secret env vars (map)
      RuntimeEnvironmentVariables:
        ENV: "production"
        LOG_LEVEL: "info"
  # Deployments are triggered explicitly from CI / deploy.sh (not on every ECR push)
  AutoDeploymentsEnabled: false

HealthCheckConfiguration:
  Protocol: HTTP
  Path: /health
  Interval: 10
  Timeout: 5
  HealthyThreshold: 3
  UnhealthyThreshold: 5

InstanceConfiguration:
  # ONNX Runtime CPU inference is enough for a demo; no GPU needed
  Cpu: "1 vCPU"
  Memory: "2 GB"

Tags:
  - Key: project
    Value: visual-inspection-report-generator
  - Key: owner
    Value: mino-zhang
